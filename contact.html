html {

  background-color: black;
  user-select: none;
}

.site-header-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  background-color: #000000;
}

.brand {
  display: flex;
  align-items: center; 
  gap: 10px;
}

.brand-name-stack {
  display: flex;
  flex-direction: column;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.1;
  text-transform: none;
}

.brand-divider {
  color: #666666;
  font-family: 'Inter', sans-serif;
  font-size: 24px; 
  font-weight: 300;
  line-height: 1;
  align-self: center;
}

.brand-subtitle-stack {
  display: flex;
  flex-direction: column;
  color: grey;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.2;
}

.main-navigation {
  display: flex;
  align-items: center;
}

.main-navigation a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  margin-left: 20px;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  display: inline-block;
  position: relative;
  padding-bottom: 6px;
}

.main-navigation a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0;
  height: 2px;
  background-color: red;
  transform: translateX(-50%);
  transition: width 0.3s ease; 
}

.main-navigation a:hover::after {
  width: 100%;
}

.main-navigation .home-link {
  display: inline-flex;
  align-items: center;
  margin-left: 0;
  margin-right: 8px; 
}

.main-navigation .home-link svg {
  width: 18px;
  height: 18px;
  transition: transform 0.2s ease;
}

.main-navigation .home-link:hover svg {
  transform: translateY(-2px);
}

.main-navigation .home-link::after {
  display: none !important;
}

h1 {
  color: white;
  text-align: left;
  font-size: 55px;
  margin: 0 0 30px 0;
  font-family: 'Poppins', sans-serif;
  font-weight: 900;
}

.intro {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  color: #b3b3b3;
  font-size: 16px;
  line-height: 1.8;
}

.footer-copyright {
  color: #666666;
  font-size: 13px;
  margin: 0;
  letter-spacing: 0.5px;
}

.footer-socials a:hover {
  color: #ffffff;
}

.footer-socials svg {
  width: 20px;
  height: 20px;
}

.site-footer {
  background-color: #000000;
  padding: 40px 24px;
  font-family: 'Inter', sans-serif;
  border-top: 1px solid #111111;
  margin-top: 80px;
}

.footer-container {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-socials a {
  color: #666666;
  text-decoration: none;
  transition: color 0.2s ease;
  display: flex;
  align-items: center;
}
</style>
